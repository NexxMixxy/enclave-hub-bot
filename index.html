<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Enclave" />
  <meta name="theme-color" content="#090a0d" />
  <title>ENCLAVE</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link id="dynamic-favicon" rel="icon" type="image/png" href="https://api.dicebear.com/7.x/shapes/svg?seed=EnclaveHub" />
  <link id="dynamic-touch-icon" rel="apple-touch-icon" href="https://api.dicebear.com/7.x/shapes/svg?seed=EnclaveHub" />

  <style>
    :root {
      --bg-base: #090a0d;
      --bg-surface: #111318;
      --bg-elevated: #171a21;
      --bg-input: #0c0e12;
      --border-subtle: rgba(255, 255, 255, 0.07);
      --border-hover: rgba(255, 255, 255, 0.16);
      --text-primary: #f3f4f6;
      --text-secondary: #9ca3af;
      --text-dim: #6b7280;
      --accent-enclave: #f59e0b;
      --accent-metro: #ef4444;
      --accent-punt: #53fc18;
      --accent-knok: #06b6d4;
      --danger: #f43f5e;
      --success: #10b981;
      --radius-lg: 12px;
      --radius-md: 8px;
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; min-width: 0; word-wrap: break-word; overflow-wrap: break-word; font-family: var(--font-sans); }
    html, body { width: 100%; height: 100%; background: #050507; color: var(--text-primary); overflow: hidden; -webkit-font-smoothing: antialiased; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.14); border-radius: 999px; }

    .viewport-wrapper { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
    .app-shell { width: 100%; height: 100%; background: var(--bg-base); display: flex; flex-direction: column; overflow: hidden; position: relative; }
    .viewport-wrapper.mode-mobile { padding: 14px; background: #020203; }
    .viewport-wrapper.mode-mobile .app-shell { width: 100%; max-width: 420px; height: 94vh; max-height: 890px; border-radius: 28px; border: 1px solid rgba(255, 255, 255, 0.14); box-shadow: 0 30px 90px rgba(0, 0, 0, 0.95); }

    .top-bar { height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 20px; background: rgba(17, 19, 24, 0.88); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-subtle); flex-shrink: 0; z-index: 20; }
    .brand-cluster { display: flex; align-items: center; gap: 11px; overflow: hidden; }
    .brand-logo { width: 32px; height: 32px; border-radius: 8px; object-fit: cover; border: 1px solid var(--border-subtle); flex-shrink: 0; background: var(--bg-elevated); }
    .brand-title { font-weight: 800; font-size: 0.88rem; letter-spacing: 0.04em; text-transform: uppercase; color: #fff; white-space: nowrap; }
    .brand-sub { font-family: var(--font-mono); font-size: 0.66rem; color: var(--text-dim); white-space: nowrap; }
    .top-controls { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .icon-svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; flex-shrink: 0; }

    .workspace { flex: 1; display: flex; overflow: hidden; position: relative; }
    .nav-rail { width: 224px; background: var(--bg-surface); border-right: 1px solid var(--border-subtle); display: flex; flex-direction: column; padding: 14px 10px; gap: 4px; flex-shrink: 0; overflow-y: auto; }
    .nav-section-label { font-family: var(--font-mono); font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); padding: 10px 12px 4px; }
    .viewport-wrapper.mode-mobile .workspace { flex-direction: column; }
    .viewport-wrapper.mode-mobile .nav-section-label { display: none; }
    .viewport-wrapper.mode-mobile .nav-rail { width: 100%; height: 58px; order: 2; flex-direction: row; justify-content: space-around; align-items: center; padding: 0 6px; border-right: none; border-top: 1px solid var(--border-subtle); overflow-x: auto; overflow-y: hidden; }

    .nav-btn { display: flex; align-items: center; gap: 11px; width: 100%; padding: 9px 12px; border-radius: var(--radius-md); border: 1px solid transparent; background: transparent; color: var(--text-secondary); font-size: 0.83rem; font-weight: 600; cursor: pointer; text-align: left; transition: all 0.15s ease; }
    .nav-btn img { width: 20px; height: 20px; border-radius: 5px; object-fit: cover; flex-shrink: 0; background: var(--bg-elevated); }
    .nav-btn:hover { background: rgba(255, 255, 255, 0.04); color: var(--text-primary); }
    .nav-btn.active { background: var(--bg-elevated); color: #fff; border-color: var(--border-subtle); }
    .nav-btn.metro-tab.active { color: #fff; background: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.3); }
    .nav-btn.punt-tab.active { color: var(--accent-punt); background: rgba(83, 252, 24, 0.08); border-color: rgba(83, 252, 24, 0.3); }
    .nav-btn.knok-tab.active { color: var(--accent-knok); background: rgba(6, 182, 212, 0.1); border-color: rgba(6, 182, 212, 0.3); }
    .nav-btn.admin-tab { color: var(--accent-enclave); margin-top: auto; }
    .nav-btn.admin-tab.active { background: rgba(245, 158, 11, 0.12); border-color: rgba(245, 158, 11, 0.35); }
    .viewport-wrapper.mode-mobile .nav-btn { flex-direction: column; justify-content: center; align-items: center; padding: 6px 8px; gap: 3px; font-size: 0.64rem; width: auto; min-width: 54px; margin-top: 0; }

    .main-stage { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 24px; display: flex; flex-direction: column; align-items: center; }
    .stage-inner { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 16px; }
    .viewport-wrapper.mode-mobile .main-stage { padding: 12px; }

    .card { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 18px; }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(185px, 1fr)); gap: 10px; }
    .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }

    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 6px; font-family: var(--font-mono); font-size: 0.68rem; font-weight: 600; background: var(--bg-elevated); color: var(--text-secondary); border: 1px solid var(--border-subtle); white-space: nowrap; }
    .badge.verified { background: rgba(6, 182, 212, 0.12); color: var(--accent-knok); border-color: rgba(6, 182, 212, 0.3); }
    .badge.tier { background: rgba(245, 158, 11, 0.1); color: var(--accent-enclave); border-color: rgba(245, 158, 11, 0.25); }
    .badge.metro { background: rgba(239, 68, 68, 0.12); color: #f87171; border-color: rgba(239, 68, 68, 0.3); }
    .badge.punt { background: rgba(83, 252, 24, 0.1); color: var(--accent-punt); border-color: rgba(83, 252, 24, 0.3); }
    .badge.knoknox { background: rgba(6, 182, 212, 0.12); color: #38bdf8; border-color: rgba(6, 182, 212, 0.3); }

    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    .form-group label { font-size: 0.75rem; font-weight: 600; color: var(--text-secondary); }
    input[type="text"], input[type="password"], input[type="number"], input[type="url"], select, textarea {
      width: 100%; font-family: var(--font-sans); background: var(--bg-input); border: 1px solid var(--border-subtle); color: var(--text-primary); padding: 10px 12px; border-radius: var(--radius-md); font-size: 0.86rem; outline: none; transition: border-color 0.15s;
    }
    textarea { resize: vertical; min-height: 82px; line-height: 1.5; }
    input:focus, select:focus, textarea:focus { border-color: rgba(255, 255, 255, 0.28); }

    .upload-dropzone { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 14px; background: var(--bg-input); border: 1px dashed rgba(255, 255, 255, 0.18); border-radius: var(--radius-md); color: var(--text-secondary); font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: all 0.15s; text-align: center; }
    .upload-dropzone:hover { border-color: var(--text-primary); color: var(--text-primary); background: rgba(255, 255, 255, 0.03); }
    .upload-dropzone input[type="file"] { display: none; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 8px 14px; border-radius: var(--radius-md); border: 1px solid transparent; font-family: var(--font-sans); font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: all 0.15s ease; white-space: nowrap; }
    .btn:disabled { opacity: 0.5; pointer-events: none; }
    .btn-primary { background: #f3f4f6; color: #090a0d; font-weight: 700; }
    .btn-primary:hover { background: #ffffff; }
    .btn-metro { background: var(--accent-metro); color: #fff; font-weight: 700; }
    .btn-punt { background: var(--accent-punt); color: #041200; font-weight: 700; }
    .btn-knok { background: var(--accent-knok); color: #041318; font-weight: 700; }
    .btn-outline { background: var(--bg-elevated); color: var(--text-primary); border-color: var(--border-subtle); }
    .btn-outline:hover { border-color: var(--border-hover); background: rgba(255,255,255,0.06); }
    .btn-danger { background: rgba(244, 63, 94, 0.12); color: #fb7185; border-color: rgba(244, 63, 94, 0.28); }
    .btn-success { background: rgba(16, 185, 129, 0.14); color: #34d399; border-color: rgba(16, 185, 129, 0.3); }
    .btn-sm { padding: 5px 10px; font-size: 0.74rem; border-radius: 6px; }

    .auth-container { max-width: 420px; width: 100%; margin: 40px auto; }
    .post-card { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .post-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .post-author { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .avatar { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border-hover); flex-shrink: 0; background: var(--bg-elevated); }
    .avatar-lg { width: 68px; height: 68px; border-radius: 50%; object-fit: cover; border: 2px solid var(--border-hover); flex-shrink: 0; background: var(--bg-elevated); }
    .post-caption { font-size: 0.9rem; line-height: 1.55; color: var(--text-primary); white-space: pre-wrap; word-break: break-word; }

    .post-media-box { width: 100%; border-radius: 10px; overflow: hidden; background: #050608; border: 1px solid var(--border-subtle); display: flex; align-items: center; justify-content: center; max-height: 440px; min-height: 64px; position: relative; }
    .post-media-box img, .post-media-box video { max-width: 100%; max-height: 430px; width: auto; height: auto; object-fit: contain; display: block; margin: 0 auto; }
    .post-media-box audio { width: 94%; margin: 14px auto; display: block; }
    .post-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; padding-top: 10px; border-top: 1px solid var(--border-subtle); }
    .shared-embed { background: var(--bg-input); border: 1px solid var(--border-subtle); border-left: 3px solid var(--text-secondary); padding: 10px 12px; border-radius: 6px; font-size: 0.8rem; }

    /* Collapsible Comments Drawer */
    .comments-drawer { background: var(--bg-input); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 12px; margin-top: 4px; display: flex; flex-direction: column; gap: 10px; }
    .comment-item { display: flex; gap: 9px; align-items: flex-start; padding-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 0.81rem; }
    .comment-item:last-child { border-bottom: none; padding-bottom: 0; }

    /* Leaderboard Table */
    .lb-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; background: var(--bg-input); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); }
    .lb-rank { width: 26px; height: 26px; border-radius: 6px; background: var(--bg-elevated); display: inline-flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 0.75rem; font-weight: 700; color: var(--accent-enclave); flex-shrink: 0; }

    /* Quota Bar */
    .quota-strip { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; padding: 9px 12px; background: var(--bg-input); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-secondary); }

    .chat-layout { display: grid; grid-template-columns: 240px 1fr; gap: 12px; min-height: 500px; }
    .viewport-wrapper.mode-mobile .chat-layout { grid-template-columns: 1fr; }
    .chat-messages { height: 360px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 12px; background: var(--bg-input); border-radius: var(--radius-md); border: 1px solid var(--border-subtle); }
    .msg-bubble { max-width: 80%; padding: 8px 12px; border-radius: 10px; background: var(--bg-elevated); border: 1px solid var(--border-subtle); align-self: flex-start; font-size: 0.84rem; }
    .msg-bubble.mine { background: rgba(255, 255, 255, 0.09); border-color: rgba(255, 255, 255, 0.18); align-self: flex-end; }
    .reply-quote { font-size: 0.72rem; padding: 4px 8px; margin-bottom: 5px; border-left: 2px solid var(--accent-enclave); background: rgba(0, 0, 0, 0.3); border-radius: 4px; color: var(--text-secondary); }

    .modal-backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 999; }
    .modal-backdrop.open { display: flex; }
    .modal-box { background: var(--bg-surface); border: 1px solid var(--border-hover); border-radius: var(--radius-lg); max-width: 580px; width: 100%; max-height: 86vh; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }

    .loading-popup-overlay { position: fixed; inset: 0; background: rgba(5, 6, 8, 0.8); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; z-index: 9999; pointer-events: all; user-select: none; }
    .loading-popup-overlay.active { display: flex; }
    .loading-popup-card { background: var(--bg-surface); border: 1px solid var(--border-hover); border-radius: 14px; padding: 22px 32px; display: flex; flex-direction: column; align-items: center; gap: 12px; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.9); text-align: center; min-width: 210px; }
    .loading-spinner-circle { width: 36px; height: 36px; border: 3px solid rgba(255, 255, 255, 0.12); border-top-color: #ffffff; border-radius: 50%; animation: enclaveSpin 0.7s linear infinite; }
    @keyframes enclaveSpin { to { transform: rotate(360deg); } }
    .loading-title-text { font-size: 0.92rem; font-weight: 700; color: #fff; }
    .loading-sub-text { font-family: var(--font-mono); font-size: 0.7rem; color: var(--text-secondary); }

    .toast { position: fixed; bottom: 20px; right: 20px; background: var(--bg-elevated); color: #fff; border: 1px solid var(--border-hover); padding: 10px 16px; border-radius: var(--radius-md); font-size: 0.8rem; font-weight: 600; z-index: 1200; display: none; box-shadow: 0 12px 30px rgba(0,0,0,0.7); }
  </style>
</head>

<div class="modal-backdrop" id="modalBackdrop">

<script>
const FALLBACK_AVATAR = "data:image/svg+xml;utf8," + encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120"><rect width="120" height="120" rx="24" fill="#171a21"/><circle cx="60" cy="46" r="20" fill="#4b5563"/><path d="M26 104c6-18 20-28 34-28s28 10 34 28" fill="#4b5563"/></svg>`
);

// CSP-Safe Global Image Fallback Listener (replaces inline onerror attributes)
window.addEventListener('error', (e) => {
  if (e.target && e.target.tagName === 'IMG' && e.target.src !== FALLBACK_AVATAR) {
    e.target.src = FALLBACK_AVATAR;
  }
}, true);

const IS_DISCORD_ACTIVITY = window.location.hostname.endsWith('.discordsays.com');
if (IS_DISCORD_ACTIVITY) {
  window.addEventListener('DOMContentLoaded', () => {
    try { window.parent.postMessage([1, { cmd: 'SET_CONFIG', args: { use_interactive_pip: false }, nonce: '1' }], '*'); } catch (e) {}
  });
}

const LOGO_CONFIG = {
  GOOGLE_SCRIPT_URL: IS_DISCORD_ACTIVITY ? '/api' : 'https://enclave-api.dankj176.workers.dev',
  ENCLAVE_HUB_LOGO: IS_DISCORD_ACTIVITY ? '/dicebear/7.x/shapes/svg?seed=EnclaveHub' : 'https://api.dicebear.com/7.x/shapes/svg?seed=EnclaveHub',
  METRO_TV_LOGO:    IS_DISCORD_ACTIVITY ? '/dicebear/7.x/identicon/svg?seed=MetroTV'  : 'https://api.dicebear.com/7.x/identicon/svg?seed=MetroTV',
  PUNT_LOGO:        IS_DISCORD_ACTIVITY ? '/dicebear/7.x/identicon/svg?seed=PUNT'     : 'https://api.dicebear.com/7.x/identicon/svg?seed=PUNT',
  KNOKNOX_LOGO:     IS_DISCORD_ACTIVITY ? '/dicebear/7.x/identicon/svg?seed=KnokNox'  : 'https://api.dicebear.com/7.x/identicon/svg?seed=KnokNox'
};

const PLATFORM_SPECS = {

/**
 * Converts Base64 DataURL into a native Browser Blob URL (`blob:...`)
 * so <video> and <audio> tags play smoothly without CSP or length limits.
 */
function dataUrlToBlobUrl(dataUrl) {
  try {
    const parts = dataUrl.split(',');
    const mimeMatch = parts[0].match(/:(.*?);/);
    const mime = mimeMatch ? mimeMatch[1] : 'application/octet-stream';
    const bstr = atob(parts[1]);
    let n = bstr.length;
    const u8arr = new Uint8Array(n);
    while (n--) {
      u8arr[n] = bstr.charCodeAt(n);
    }
    const blob = new Blob([u8arr], { type: mime });
    return URL.createObjectURL(blob);
  } catch (e) {
    return dataUrl;
  }
}

/**
 * Hydrates all <video> and <audio> elements that use `gdrive:` or `data:` streams into playable Blob URLs!
 */
async function hydrateMediaStreams() {
  const mediaEls = document.querySelectorAll('[data-stream-src]');
  for (const el of mediaEls) {
    const rawSrc = el.getAttribute('data-stream-src');
    if (!rawSrc || el.getAttribute('data-hydrated') === '1') continue;
    el.setAttribute('data-hydrated', '1');

    if (MEDIA_BLOB_CACHE[rawSrc]) {
      el.src = MEDIA_BLOB_CACHE[rawSrc];
      continue;
    }

    if (rawSrc.startsWith('data:')) {
      const blobUrl = dataUrlToBlobUrl(rawSrc);
      MEDIA_BLOB_CACHE[rawSrc] = blobUrl;
      el.src = blobUrl;
      continue;
    }

    // Handle gdrive:FILE_ID:MIME or legacy drive.google.com/uc?id=FILE_ID
    let fileId = '';
    let mimeType = el.tagName === 'AUDIO' ? 'audio/mpeg' : 'video/mp4';
    if (rawSrc.startsWith('gdrive:')) {
      const bits = rawSrc.split(':');
      fileId = bits[1] || '';
      if (bits[2]) mimeType = bits[2];
    } else {
      const m = rawSrc.match(/[?&]id=([a-zA-Z0-9_-]+)/);
      if (m && m[1]) fileId = m[1];
    }

    if (fileId) {
      try {
        const scriptUrl = (LOGO_CONFIG.GOOGLE_SCRIPT_URL || '').trim();
        const resp = await fetch(scriptUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'getMedia', fileId, mimeType })
        });
        const res = await resp.json();
        if (res && res.ok && res.dataUrl) {
          const blobUrl = dataUrlToBlobUrl(res.dataUrl);
          MEDIA_BLOB_CACHE[rawSrc] = blobUrl;
          el.src = blobUrl;
        }
      } catch (err) {
        console.warn('Stream fetch error:', err);
      }
    } else {
      el.src = rawSrc;
    }
  }
}

function autoResizeImageFile(file, maxWidth, maxHeight, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width;
        let h = img.height;
        const ratio = Math.min(maxWidth / w, maxHeight / h, 1);
        w = Math.max(1, Math.round(w * ratio));
        h = Math.max(1, Math.round(h * ratio));
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#090a0d';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        let q = quality || 0.74;
        let dataUrl = canvas.toDataURL('image/jpeg', q);
        while (dataUrl.length > 36000 && q > 0.35) {
          q -= 0.1;
          dataUrl = canvas.toDataURL('image/jpeg', q);
        }
        resolve({ dataUrl, width: w, height: h, resolution: w + '×' + h });
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function fixMediaUrl(url) {
  if (!url) return '';
  const str = String(url).trim();
  const match = str.match(/drive\.google\.com\/uc\?export=view&id=([a-zA-Z0-9_-]+)/);
  if (match && match[1]) {
    return 'https://drive.google.com/thumbnail?id=' + match[1] + '&sz=w800';
  }
  return str;
}

function formatCountdownUntil(isoTarget) {
  if (!isoTarget) return 'Soon';
  const diff = Math.max(0, new Date(isoTarget).getTime() - Date.now());
  const hrs = Math.floor(diff / 3600000);
  const mins = Math.floor((diff % 3600000) / 60000);
  return hrs + 'h ' + mins + 'm';
}

async function apiCall(payload, loadingMessage) {
  if (STATE.isBusy && payload.action !== 'getBootstrap') {
    return { ok: false, error: 'Action in progress...' };
  }
  if (loadingMessage) showLoading(loadingMessage);

  const scriptUrl = (LOGO_CONFIG.GOOGLE_SCRIPT_URL || '').trim();
  try {
    const response = await fetch(scriptUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    return await response.json();
  } catch (err) {
    showToast('Connection error: ' + err.message);
    return { ok: false, error: err.message };
  } finally {
    if (loadingMessage) hideLoading();
  }
}

function ingestBootstrap(res, skipCacheSave) {
  if (!res || !res.currentUser) return;
  STATE.currentUser = res.currentUser;
  STATE.users = res.users || [];
  STATE.posts = res.posts || [];
  STATE.connections = res.connections || [];
  STATE.blocks = res.blocks || [];
  STATE.groups = res.groups || [];
  STATE.messages = res.messages || [];
  STATE.reports = res.reports || [];
  STATE.history = res.history || [];

  if (res.brandLogos) {
    ['ENCLAVE_HUB_LOGO', 'METRO_TV_LOGO', 'PUNT_LOGO', 'KNOKNOX_LOGO'].forEach(k => {
      if (res.brandLogos[k]) LOGO_CONFIG[k] = res.brandLogos[k];
    });
    localStorage.setItem('enclave_cached_logos', JSON.stringify(LOGO_CONFIG));
  } else if (res.globalAdminLogo) {
    LOGO_CONFIG.ENCLAVE_HUB_LOGO = res.globalAdminLogo;
  }
  applyLogos();

  localStorage.setItem('enclave_session_user', STATE.currentUser.username);
  if (!skipCacheSave) {
    try { localStorage.setItem('enclave_state_cache_' + STATE.currentUser.username.toLowerCase(), JSON.stringify(res)); } catch (e) {}
  }

  document.getElementById('navRail').style.display = 'flex';
  document.getElementById('syncBtn').style.display = 'inline-flex';
  document.getElementById('logoutBtn').style.display = 'inline-flex';
  const adminTab = document.getElementById('navAdminBtn');
  if (adminTab) adminTab.style.display = STATE.currentUser.isAdmin ? 'flex' : 'none';

  render();
  if (STATE.openOPModalUser) openOPProfileModal(STATE.openOPModalUser);
}

async function refreshFromServer(withLoadingPopup) {
  const user = STATE.currentUser ? STATE.currentUser.username : localStorage.getItem('enclave_session_user');
  if (!user) return;
  const res = await apiCall({ action: 'getBootstrap', username: user }, withLoadingPopup ? 'Syncing Feed' : null);
  if (res && res.ok && res.currentUser) {
    ingestBootstrap(res);
    if (withLoadingPopup) showToast('Feed synchronized.');
  }
}

function logout() {
  localStorage.removeItem('enclave_session_user');
  STATE.currentUser = null;

  document.getElementById('navRail').style.display = 'none';

async function handleMediaFileSelect(inputEl, platformKey) {
  const file = inputEl.files && inputEl.files[0];
  const statusEl = document.getElementById('mediaCheckStatus');
  const previewEl = document.getElementById('mediaLivePreviewBox');
  if (!file) return;

  const spec = PLATFORM_SPECS[platformKey];

  if (file.type.startsWith('image/')) {
    showLoading('Optimizing Image...');
    try {
      const resized = await autoResizeImageFile(file, spec.targetMaxW, spec.targetMaxH, 0.76);
      STATE.pendingMedia = { dataUrl: resized.dataUrl, mediaType: 'image', durationSec: 0, resolution: resized.resolution };
      if (statusEl) statusEl.innerHTML = `<span style="color:var(--success);">Image Ready (${resized.resolution})</span>`;
      if (previewEl) {
        previewEl.style.display = 'flex';
        previewEl.innerHTML = `<img src="${resized.dataUrl}" alt="Preview" />`;
      }
    } catch (err) {
      showToast('Failed to process image.');
    } finally {
      hideLoading();
    }
  } else if (file.type.startsWith('video/') || file.type.startsWith('audio/')) {
    if (file.size > 22 * 1024 * 1024) {
      inputEl.value = '';
      showToast('Please keep video/audio files under 22MB for smooth streaming.');
      return;
    }
    const isVideo = file.type.startsWith('video/');
    const tempBlobUrl = URL.createObjectURL(file);
    const mediaEl = document.createElement(isVideo ? 'video' : 'audio');
    mediaEl.preload = 'metadata';

    showLoading('Verifying Media Stream...');
    mediaEl.onloadedmetadata = () => {
      const dur = Math.round(mediaEl.duration || 0);
      const res = isVideo ? (mediaEl.videoWidth + '×' + mediaEl.videoHeight) : 'MP3/Audio';

      if (dur > spec.maxDurationSec) {
        URL.revokeObjectURL(tempBlobUrl);
        hideLoading();
        STATE.pendingMedia = { dataUrl: '', mediaType: 'none', durationSec: 0, resolution: '' };
        inputEl.value = '';
        if (statusEl) statusEl.innerHTML = `<span style="color:var(--danger);">Exceeds ${spec.maxDurationSec/60}m limit (${dur}s)</span>`;
        showToast(`${spec.name} max duration is ${spec.maxDurationSec / 60}m.`);
        return;
      }

      const reader = new FileReader();
      reader.onload = ev => {
        hideLoading();
        STATE.pendingMedia = { dataUrl: ev.target.result, mediaType: isVideo ? 'video' : 'audio', durationSec: dur, resolution: res };
        if (statusEl) statusEl.innerHTML = `<span style="color:var(--success);">Stream Verified (${dur}s • ${res})</span>`;
        if (previewEl) {
          previewEl.style.display = 'flex';
          previewEl.innerHTML = isVideo
            ? `<video src="${tempBlobUrl}" controls playsinline></video>`
            : `<audio src="${tempBlobUrl}" controls></audio>`;
        }
      };
      reader.readAsDataURL(file);
    };
    mediaEl.onerror = () => {
      URL.revokeObjectURL(tempBlobUrl);
      hideLoading();
      showToast('Unsupported video/audio format. Use MP4, WebM, or MP3.');
    };
    mediaEl.src = tempBlobUrl;
  }
}

function render() {

  switch (STATE.currentPage) {
    case 'profile': stage.innerHTML = renderProfileView(); bindProfileEvents(); break;
    case 'metrotv': stage.innerHTML = renderPlatformView('METROTV'); bindPlatformEvents('METROTV'); break;
    case 'punt': stage.innerHTML = renderPlatformView('PUNT'); bindPlatformEvents('PUNT'); break;
    case 'knoknox': stage.innerHTML = renderPlatformView('KNOKNOX'); bindPlatformEvents('KNOKNOX'); break;
    case 'search': stage.innerHTML = renderSearchView(); bindSearchEvents(); break;
    case 'connections': stage.innerHTML = renderConnectionsView(); bindChatEvents(); break;
    case 'admin': stage.innerHTML = STATE.currentUser.isAdmin ? renderAdminView() : renderProfileView(); if (STATE.currentUser.isAdmin) bindAdminEvents(); break;
    default: stage.innerHTML = renderProfileView();
  }
  hydrateMediaStreams();
}

  if (sTab) sTab.addEventListener('click', () => { STATE.authTab = 'signup'; render(); });

  const lForm = document.getElementById('loginForm');
  if (lForm) {
    lForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      const res = await apiCall({ action: 'login', username, password }, 'Authenticating');
      if (!res.ok) return showToast(res.error || 'Authentication failed');
      ingestBootstrap(res);
    });
  }

  const sForm = document.getElementById('signupForm');
  if (sForm) {
    const fileInput = document.getElementById('signupPicFile');
    if (fileInput) {
      fileInput.addEventListener('change', () => {
        document.getElementById('signupFileName').textContent = fileInput.files[0] ? fileInput.files[0].name : 'Upload Avatar Image';
      });
    }
    sForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('signupUsername').value.trim();
      const displayName = document.getElementById('signupDisplayName').value.trim();
      const password = document.getElementById('signupPassword').value.trim();
      const initialFollowers = Number(document.getElementById('signupFollowers').value || 10);
      const urlInput = document.getElementById('signupPicUrl').value.trim();

      let profilePic = urlInput;
      if (fileInput && fileInput.files && fileInput.files[0]) {
        showLoading('Processing Avatar');
        const resized = await autoResizeImageFile(fileInput.files[0], 240, 240, 0.78);
        profilePic = resized.dataUrl;
        hideLoading();
      }

      const res = await apiCall({ action: 'signup', username, displayName, password, initialFollowers, profilePic }, 'Provisioning Account');
      if (!res.ok) return showToast(res.error || 'Registration failed');
      ingestBootstrap(res);
    });
  }
}

function renderPlatformLeaderboardHTML(platformKey) {
  const spec = PLATFORM_SPECS[platformKey];
  const sortKey = STATE.leaderboardSort || 'followers';

  // Filter creators who have activated this platform or posted on it
  const activeFlag = platformKey === 'METROTV' ? 'metroActive' : (platformKey === 'PUNT' ? 'puntActive' : 'knoknoxActive');
  const ranked = STATE.users
    .map(u => {
      const ps = (u.platformStats && u.platformStats[platformKey]) || { followers: u[spec.folKey] || 0, posts: 0, upvotes: 0, downvotes: 0 };
      return {
        username: u.username,
        displayName: u.displayName,
        profilePic: u.profilePic,
        verified: u.verified,
        tierLabel: u.tierLabel,
        isActive: u[activeFlag],
        platFollowers: Number(ps.followers || 0),
        totalFollowers: Number(u.totalFollowers || 0),
        avgFollowers: Number(u.followers || 0),
        posts: Number(ps.posts || 0),
        upvotes: Number(ps.upvotes || 0),
        downvotes: Number(ps.downvotes || 0)
      };
    })
    .filter(x => x.isActive || x.posts > 0 || x.platFollowers > 0)
    .sort((a, b) => {
      if (sortKey === 'posts') return b.posts - a.posts || b.platFollowers - a.platFollowers;
      if (sortKey === 'upvotes') return b.upvotes - a.upvotes || b.platFollowers - a.platFollowers;
      if (sortKey === 'downvotes') return b.downvotes - a.downvotes || b.platFollowers - a.platFollowers;
      return b.platFollowers - a.platFollowers || b.totalFollowers - a.totalFollowers;
    });

  return `
    <div class="card" style="display:flex; flex-direction:column; gap:12px;">
      <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;">
        <div>
          <h3 style="font-size:0.95rem; font-weight:800;">${ICONS.trophy} ${spec.name} Creator Leaderboard</h3>
          <p style="font-size:0.74rem; color:var(--text-secondary);">Ranked by ${spec.name} metrics • Shows Network Following & Total Combined Following</p>
        </div>
        <div style="display:flex; gap:6px; flex-wrap:wrap;">
          <button type="button" class="btn btn-sm ${sortKey==='followers'?'btn-primary':'btn-outline'} lb-sort-btn" data-sort="followers">Most Followers</button>
          <button type="button" class="btn btn-sm ${sortKey==='posts'?'btn-primary':'btn-outline'} lb-sort-btn" data-sort="posts">Most Posts</button>
          <button type="button" class="btn btn-sm ${sortKey==='upvotes'?'btn-primary':'btn-outline'} lb-sort-btn" data-sort="upvotes">Most Upvotes</button>
          <button type="button" class="btn btn-sm ${sortKey==='downvotes'?'btn-primary':'btn-outline'} lb-sort-btn" data-sort="downvotes">Most Downvotes</button>
        </div>
      </div>

      <div style="display:flex; flex-direction:column; gap:8px;">
        ${ranked.length === 0 ? `<p style="font-size:0.8rem; color:var(--text-secondary);">No creators ranked on ${spec.name} yet.</p>` :
          ranked.map((c, idx) => `
            <div class="lb-row">
              <div style="display:flex; align-items:center; gap:10px; cursor:pointer;" class="op-profile-trigger" data-user="${escapeHtml(c.username)}">
                <span class="lb-rank">#${idx + 1}</span>
                <img src="${escapeHtml(fixMediaUrl(c.profilePic) || FALLBACK_AVATAR)}" class="avatar" style="width:34px;height:34px;" alt="" />
                <div>
                  <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
                    <strong style="font-size:0.86rem;">${escapeHtml(c.displayName)}</strong>
                    ${c.verified ? `<span class="badge verified">✓</span>` : ''}
                    <span class="badge tier">${escapeHtml(c.tierLabel)}</span>
                  </div>
                  <div style="font-family:var(--font-mono); font-size:0.68rem; color:var(--text-secondary);">
                    @${escapeHtml(c.username)} • Total Combined: ${c.totalFollowers.toLocaleString()} (Main Avg: ${c.avgFollowers.toLocaleString()})
                  </div>
                </div>
              </div>

              <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-family:var(--font-mono); font-size:0.74rem;">
                <span class="badge ${spec.badgeClass}">${spec.name}: ${c.platFollowers.toLocaleString()} fol</span>
                <span class="badge">${c.posts} posts</span>
                <span class="badge" style="color:var(--success);">+${c.upvotes.toLocaleString()}</span>
                <span class="badge" style="color:var(--danger);">-${c.downvotes.toLocaleString()}</span>
              </div>
            </div>
          `).join('')}
      </div>

      render();
    });

  if (actBtn) {
    actBtn.addEventListener('click', async () => {
      const res = await apiCall({ action: 'togglePlatform', username: STATE.currentUser.username, platform: platformKey }, 'Enabling Channel');
      if (!res.ok) return showToast(res.error);
      ingestBootstrap(res);
    });
  }

  const studioBtn = document.getElementById('toggleStudioBtn');
  if (studioBtn) {
    studioBtn.addEventListener('click', () => {
      STATE.composerOpen = !STATE.composerOpen;
      render();
    });
  }

  const fileInput = document.getElementById('postMediaFileInput');
  if (fileInput) {
    fileInput.addEventListener('change', async () => {
      document.getElementById('uploadFileNameLabel').textContent = fileInput.files[0] ? fileInput.files[0].name : 'Select Media';
      await handleMediaFileSelect(fileInput, platformKey);
    });
  }

  const postForm = document.getElementById('platformPostForm');
  if (postForm) {
    postForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const caption = document.getElementById('postCaptionInput').value.trim();
      const directUrl = document.getElementById('postDirectMediaUrl').value.trim();
      const directType = document.getElementById('postDirectMediaType').value;

      let mediaUrl = STATE.pendingMedia.dataUrl;
      let mediaType = STATE.pendingMedia.mediaType;
      let durationSec = STATE.pendingMedia.durationSec;
      let resolution = STATE.pendingMedia.resolution || '';

      if (!mediaUrl && directUrl) {
        mediaUrl = directUrl;
        mediaType = directType;
      }

      const res = await apiCall({ action: 'createPost', author: STATE.currentUser.username, platform: platformKey, caption, mediaUrl, mediaType, durationSec, resolution }, 'Publishing Post');
      if (!res.ok) return showToast(res.error);
      STATE.composerOpen = false;
      STATE.pendingMedia = { dataUrl: '', mediaType: 'none', durationSec: 0, resolution: '' };
      ingestBootstrap(res);
      showToast('Published!');
    });
  }

  bindGlobalPostEvents();
}

function bindGlobalPostEvents() {
  document.querySelectorAll('.op-profile-trigger').forEach(el => {
    el.addEventListener('click', () => openOPProfileModal(el.getAttribute('data-user')));
  });

  document.querySelectorAll('.vote-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      await voteOnPost(btn.getAttribute('data-id'), btn.getAttribute('data-type'));
    });
  });

  document.querySelectorAll('.toggle-comments-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const pid = btn.getAttribute('data-id');
      STATE.openCommentsMap[pid] = !STATE.openCommentsMap[pid];
      render();
      if (STATE.openOPModalUser) openOPProfileModal(STATE.openOPModalUser);
    });
  });

  document.querySelectorAll('.comment-submit-form').forEach(form => {
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const postId = form.getAttribute('data-id');
      const inputEl = document.getElementById('commentInput_' + postId);
      const text = inputEl ? inputEl.value.trim() : '';
      if (!text) return;

      const res = await apiCall({
        action: 'addComment',
        postId: postId,
        author: STATE.currentUser.username,
        text: text
      }, 'Posting Comment');

      if (!res || !res.ok) return showToast((res && res.error) ? res.error : 'Failed to post comment');

      if (res.fastComment && res.comment) {
        const targetPost = STATE.posts.find(p => String(p.postId) === String(postId));
        if (targetPost) {
          if (!Array.isArray(targetPost.comments)) targetPost.comments = [];
          targetPost.comments.push(res.comment);
        }
        render();
        if (STATE.openOPModalUser) openOPProfileModal(STATE.openOPModalUser);
      } else if (res.currentUser) {
        ingestBootstrap(res);
      }
    });
  });

  document.querySelectorAll('.repost-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      await sharePostAsMyOwn(btn.getAttribute('data-id'));
    });
  });

  document.querySelectorAll('.share-chat-btn').forEach(btn => {
    btn.addEventListener('click', () => openShareToChatModal(btn.getAttribute('data-id')));
  });

  document.querySelectorAll('.report-btn').forEach(btn => {
    btn.addEventListener('click', () => openReportModal(btn.getAttribute('data-id')));
  });
}

async function voteOnPost(postId, voteType) {
  if (STATE.isBusy) return;
  const targetPost = STATE.posts.find(p => String(p.postId) === String(postId));
  if (!targetPost) return;

  const res = await apiCall({ action: 'votePost', postId, username: STATE.currentUser.username, voteType }, 'Updating Vote');
  if (!res || !res.ok) return showToast((res && res.error) ? res.error : 'Vote failed');

  if (res.fastVote) {
    const prevUp = targetPost.upvotes;
    const prevDown = targetPost.downvotes;
    targetPost.upvotes = res.upvotes;
    targetPost.downvotes = res.downvotes;
    targetPost.myVote = res.myVote;

    const deltaUp = res.upvotes - prevUp;
    const deltaDown = res.downvotes - prevDown;
    const authorObj = STATE.users.find(u => u.username.toLowerCase() === targetPost.author.toLowerCase());
    if (authorObj) {
      authorObj.totalUpvotes = Math.max(0, (authorObj.totalUpvotes || 0) + deltaUp);
      authorObj.totalDownvotes = Math.max(0, (authorObj.totalDownvotes || 0) + deltaDown);
    }
    render();
    if (STATE.openOPModalUser) openOPProfileModal(STATE.openOPModalUser);
  } else if (res.currentUser) {
    ingestBootstrap(res);
  }
}

async function sharePostAsMyOwn(postId) {
  const orig = STATE.posts.find(p => p.postId === postId);
  if (!orig) return;
  const res = await apiCall({ action: 'createPost', author: STATE.currentUser.username, platform: orig.platform, caption: orig.caption, mediaUrl: orig.mediaUrl, mediaType: orig.mediaType, durationSec: orig.durationSec, resolution: orig.resolution, sharedFromId: orig.postId, sharedFromAuthor: orig.author }, 'Reposting');
  if (!res.ok) return showToast(res.error);
  ingestBootstrap(res);
  showToast('Reposted.');
}

function getConnectionStatus(me, other) {
  const m = me.toLowerCase();
  const o = other.toLowerCase();
  const isBlocked = STATE.blocks.some(b => (b.blocker.toLowerCase() === m && b.blocked.toLowerCase() === o) || (b.blocker.toLowerCase() === o && b.blocked.toLowerCase() === m));
  if (isBlocked) return 'BLOCKED';
  const conn = STATE.connections.find(c => (c.requester.toLowerCase() === m && c.receiver.toLowerCase() === o) || (c.requester.toLowerCase() === o && c.receiver.toLowerCase() === m));
  if (!conn) return 'NONE';
  if (conn.status === 'ACCEPTED') return 'CONNECTED';
  if (conn.status === 'PENDING') return 'PENDING';
  return 'NONE';
}

            </div>
          </div>

          <div class="chat-messages" id="chatMessagesBox">
            ${activeMsgs.length === 0 ? `<p style="font-size:0.78rem; color:var(--text-dim); margin:auto;">No messages in this channel.</p>` :
              activeMsgs.map(m => {
                const isMine = m.sender.toLowerCase() === me;
                const sharedPost = m.sharedPostId ? STATE.posts.find(p => p.postId === m.sharedPostId) : null;
                return `
                  <div class="msg-bubble ${isMine ? 'mine' : ''}">
                    <div style="display:flex; justify-content:space-between; gap:10px; font-family:var(--font-mono); font-size:0.68rem; color:var(--text-secondary); margin-bottom:4px;">
                      <span>@${escapeHtml(m.sender)}</span>
                      <span style="cursor:pointer; text-decoration:underline;" class="reply-msg-trigger" data-id="${escapeHtml(m.msgId)}" data-preview="${escapeHtml(m.sender)}: ${escapeHtml((m.text || 'Media').slice(0,30))}">Reply</span>
                    </div>
                    ${m.replyPreview ? `<div class="reply-quote">${escapeHtml(m.replyPreview)}</div>` : ''}
                    ${m.text ? `<div>${escapeHtml(m.text)}</div>` : ''}
                    ${m.mediaUrl ? `<img src="${escapeHtml(fixMediaUrl(m.mediaUrl))}" style="max-width:220px; border-radius:6px; margin-top:6px; display:block;" alt="" />` : ''}
                    ${sharedPost ? `<div class="shared-embed" style="margin-top:6px;">Shared from @${escapeHtml(sharedPost.author)}: "${escapeHtml(sharedPost.caption.slice(0, 70))}"</div>` : ''}
                  </div>
                `;
              }).join('')}
          </div>

          ${STATE.activeChat.replyPreview ? `
            <div style="display:flex; align-items:center; justify-content:space-between; background:var(--bg-input); padding:6px 10px; border-radius:6px; font-size:0.74rem;">
              <span>Replying to: <strong>${escapeHtml(STATE.activeChat.replyPreview)}</strong></span>
              <button class="btn btn-outline btn-sm" id="cancelReplyBtn">Cancel</button>
            </div>
          ` : ''}

          <form id="chatMessageForm" style="display:flex; gap:8px; align-items:center;">
            <label class="btn btn-outline" style="cursor:pointer; padding:9px 11px;">
              ${ICONS.upload}
              <input type="file" id="chatImageInput" accept="image/*" style="display:none;" />
            </label>
            <input type="text" id="chatTextInput" placeholder="Message..." style="flex:1;" />
            <button type="submit" class="btn btn-primary">Send</button>
          </form>
        `}
      </div>
    </div>
  `;
}

function bindChatEvents() {
  document.querySelectorAll('.chat-select-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      STATE.activeChat = { type: btn.getAttribute('data-type'), targetId: btn.getAttribute('data-target'), replyToMsgId: '', replyPreview: '' };
      render();
    });
  });

  const createGroupBtn = document.getElementById('createGroupModalBtn');
  if (createGroupBtn) createGroupBtn.addEventListener('click', openCreateGroupModal);

  document.querySelectorAll('.reply-msg-trigger').forEach(el => {
    el.addEventListener('click', () => {
      STATE.activeChat.replyToMsgId = el.getAttribute('data-id');
      STATE.activeChat.replyPreview = el.getAttribute('data-preview');
      render();
    });
  });

  const cancelReplyBtn = document.getElementById('cancelReplyBtn');
  if (cancelReplyBtn) {
    cancelReplyBtn.addEventListener('click', () => {
      STATE.activeChat.replyToMsgId = '';
      STATE.activeChat.replyPreview = '';
      render();
    });
  }

  const chatForm = document.getElementById('chatMessageForm');
  if (chatForm) {
    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = document.getElementById('chatTextInput').value.trim();
      const imgInput = document.getElementById('chatImageInput');
      let mediaUrl = '';
      if (imgInput && imgInput.files && imgInput.files[0]) {
        showLoading('Optimizing Image');
        const resized = await autoResizeImageFile(imgInput.files[0], 420, 420, 0.72);
        mediaUrl = resized.dataUrl;
        hideLoading();
      }
      if (!text && !mediaUrl) return;

      const res = await apiCall({ action: 'sendMessage', sender: STATE.currentUser.username, chatType: STATE.activeChat.type, targetId: STATE.activeChat.targetId, text, mediaUrl, replyToMsgId: STATE.activeChat.replyToMsgId, replyPreview: STATE.activeChat.replyPreview }, 'Sending');
      if (!res.ok) return showToast(res.error);
      STATE.activeChat.replyToMsgId = '';
      STATE.activeChat.replyPreview = '';
      ingestBootstrap(res);
    });
  }
}

function openCreateGroupModal() {
  STATE.openOPModalUser = null;
  const box = document.getElementById('modalContent');
  const candidates = STATE.users.filter(u => u.username.toLowerCase() !== STATE.currentUser.username.toLowerCase());
  box.innerHTML = `
    <h3 style="font-size:1rem;">New Private Group (Max 5 Members)</h3>
    <div class="form-group">
      <label>Group Name</label>
      <input type="text" id="newGroupName" placeholder="Group title" />
    </div>
    <div class="form-group">
      <label>Select Up to 4 Members</label>
      <div style="display:flex; flex-direction:column; gap:6px; max-height:180px; overflow-y:auto; padding:10px; background:var(--bg-input); border-radius:var(--radius-md); border:1px solid var(--border-subtle);">
        ${candidates.map(u => `
          <label style="display:flex; align-items:center; gap:8px; color:var(--text-primary); cursor:pointer;">
            <input type="checkbox" class="group-member-check" value="${escapeHtml(u.username)}" />
            <span>${escapeHtml(u.displayName)} (@${escapeHtml(u.username)})</span>
          </label>
        `).join('')}
      </div>
    </div>
    <div style="display:flex; justify-content:flex-end; gap:8px;">
      <button class="btn btn-outline btn-sm" id="closeModalBtn">Cancel</button>
      <button class="btn btn-primary btn-sm" id="submitCreateGroupBtn">Create</button>
    </div>
  `;
  document.getElementById('modalBackdrop').classList.add('open');
  document.getElementById('closeModalBtn').addEventListener('click', closeModal);
  document.getElementById('submitCreateGroupBtn').addEventListener('click', async () => {
    const groupName = document.getElementById('newGroupName').value.trim();
    const checked = Array.from(document.querySelectorAll('.group-member-check:checked')).map(el => el.value);
    if (checked.length > 4) return showToast('Maximum 5 members total.');
    const res = await apiCall({ action: 'createGroup', creator: STATE.currentUser.username, groupName, members: [STATE.currentUser.username, ...checked] }, 'Creating Group');
    if (!res.ok) return showToast(res.error);
    closeModal();
    ingestBootstrap(res);
  });
}

function openShareToChatModal(postId) {
  STATE.openOPModalUser = null;
  const me = STATE.currentUser.username.toLowerCase();
  const connectedUsers = STATE.connections.filter(c => c.status === 'ACCEPTED' && (c.requester.toLowerCase() === me || c.receiver.toLowerCase() === me)).map(c => c.requester.toLowerCase() === me ? c.receiver : c.requester);
  const box = document.getElementById('modalContent');
  box.innerHTML = `
    <h3 style="font-size:1rem;">Forward Post to Chat</h3>
    <div class="form-group">
      <label>Channel</label>
      <select id="shareChatDestination">
        ${connectedUsers.map(u => `<option value="DM:${escapeHtml(u)}">@${escapeHtml(u)}</option>`).join('')}
        ${STATE.groups.map(g => `<option value="GROUP:${escapeHtml(g.groupId)}">Group: ${escapeHtml(g.groupName)}</option>`).join('')}
      </select>
    </div>
    <div class="form-group">
      <label>Message (Optional)</label>
      <input type="text" id="shareChatComment" placeholder="Add a note..." />
    </div>
    <div style="display:flex; justify-content:flex-end; gap:8px;">
      <button class="btn btn-outline btn-sm" id="closeModalBtn">Cancel</button>
      <button class="btn btn-primary btn-sm" id="submitShareChatBtn">Send</button>
    </div>
  `;
  document.getElementById('modalBackdrop').classList.add('open');
  document.getElementById('closeModalBtn').addEventListener('click', closeModal);
  document.getElementById('submitShareChatBtn').addEventListener('click', async () => {
    const dest = document.getElementById('shareChatDestination').value;
    if (!dest) return showToast('No chat destination.');
    const [chatType, targetId] = dest.split(':');
    const text = document.getElementById('shareChatComment').value.trim() || 'Shared a post:';
    const res = await apiCall({ action: 'sendMessage', sender: STATE.currentUser.username, chatType, targetId, text, sharedPostId: postId }, 'Forwarding Post');
    if (!res.ok) return showToast(res.error);
    closeModal();
    ingestBootstrap(res);
    showToast('Sent.');
  });
}

function renderAdminView() {
  return `
    <div class="card" style="border-top:2px solid var(--accent-enclave);">
      <div style="display:flex; align-items:center; gap:12px;">
        <img src="${escapeHtml(fixMediaUrl(LOGO_CONFIG.ENCLAVE_HUB_LOGO) || FALLBACK_AVATAR)}" class="avatar" alt="" />
        <div>
          <h2 style="font-size:1.05rem; font-weight:800; color:var(--accent-enclave);">ENCLAVE ADMINISTRATION</h2>
          <p style="font-size:0.75rem; color:var(--text-secondary);">Brand Assets • Moderation Queue • Access Blocks • Per-Platform Audience Overrides</p>
        </div>
      </div>
    </div>

    <div class="card">
      <h3 style="font-size:0.9rem; font-weight:700; margin-bottom:10px;">Network Brand Logos</h3>
      <div class="grid-2">
        ${[
          { title: 'Enclave Hub Logo', key: 'ENCLAVE_HUB_LOGO', fId: 'logoFile_HUB', uId: 'logoUrl_HUB' },
          { title: 'Metro TV Logo', key: 'METRO_TV_LOGO', fId: 'logoFile_METRO', uId: 'logoUrl_METRO' },
          { title: 'PUNT Logo', key: 'PUNT_LOGO', fId: 'logoFile_PUNT', uId: 'logoUrl_PUNT' },
          { title: 'KnokNox Logo', key: 'KNOKNOX_LOGO', fId: 'logoFile_KNOK', uId: 'logoUrl_KNOK' }
        ].map(item => `
          <div style="background:var(--bg-input); padding:12px; border-radius:var(--radius-md); border:1px solid var(--border-subtle);">
            <div style="display:flex; align-items:center; gap:10px; margin-bottom:8px;">
              <img src="${fixMediaUrl(LOGO_CONFIG[item.key]) || FALLBACK_AVATAR}" style="width:32px;height:32px;border-radius:6px;object-fit:cover;" alt="" />
              <strong style="font-size:0.82rem;">${item.title}</strong>
            </div>
            <label class="upload-dropzone" style="padding:7px 10px; margin-bottom:6px;">
              ${ICONS.upload} <span id="lbl_${item.fId}">Upload Image File</span>
              <input type="file" id="${item.fId}" accept="image/*" />
            </label>
            <input type="url" id="${item.uId}" placeholder="Or paste direct image URL" />
          </div>
        `).join('')}
      </div>
      <button class="btn btn-primary btn-sm" id="saveLogosBtn" style="margin-top:12px;">Update Global Brand Assets</button>
    </div>

    <div class="card">
      <h3 style="font-size:0.9rem; font-weight:700; margin-bottom:10px;">Moderation Reports (${STATE.reports.length})</h3>
      ${STATE.reports.length === 0 ? `<p style="font-size:0.8rem; color:var(--text-secondary);">Queue is clear.</p>` : `
        <div style="display:flex; flex-direction:column; gap:8px;">
          ${STATE.reports.map(r => `
            <div style="background:var(--bg-input); padding:12px; border-radius:var(--radius-md); border:1px solid var(--border-subtle); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;">
              <div>
                <div style="display:flex; align-items:center; gap:6px;">
                  <span class="badge">${escapeHtml(r.platform)}</span>
                  <strong style="font-size:0.82rem;">${escapeHtml(r.postId)}</strong>
                  <span style="font-size:0.78rem; color:var(--text-secondary);">by @${escapeHtml(r.postAuthor)}</span>
                  <span class="badge">${escapeHtml(r.status)}</span>
                </div>
                <div style="font-size:0.78rem; color:var(--text-secondary); margin-top:4px;">Flagged by @${escapeHtml(r.reporter)}: "${escapeHtml(r.reason)}"</div>
              </div>
              <div style="display:flex; gap:6px;">
                <button class="btn btn-danger btn-sm admin-exec-btn" data-sub="TAKEDOWN_POST" data-post="${escapeHtml(r.postId)}">Take Down</button>
                <button class="btn btn-outline btn-sm admin-exec-btn" data-sub="IGNORE_REPORT" data-rep="${escapeHtml(r.reportId)}">Dismiss</button>
                <button class="btn btn-outline btn-sm admin-exec-btn" data-sub="DELETE_REPORT" data-rep="${escapeHtml(r.reportId)}">Delete</button>
              </div>
            </div>
          `).join('')}
        </div>
      `}
    </div>

    <div class="card">
      <h3 style="font-size:0.9rem; font-weight:700; margin-bottom:10px;">Active Blocks (${STATE.blocks.length})</h3>
      ${STATE.blocks.length === 0 ? `<p style="font-size:0.8rem; color:var(--text-secondary);">No active blocks.</p>` : `
        <div class="grid-2">
          ${STATE.blocks.map(b => `
            <div style="background:var(--bg-input); padding:10px 12px; border-radius:var(--radius-md); border:1px solid var(--border-subtle); display:flex; align-items:center; justify-content:space-between;">
              <span style="font-size:0.8rem;"><strong>@${escapeHtml(b.blocker)}</strong> blocked <strong>@${escapeHtml(b.blocked)}</strong></span>
              <button class="btn btn-success btn-sm admin-unblock-btn" data-id="${escapeHtml(b.blockId)}">Unblock</button>
            </div>
          `).join('')}
        </div>
      `}
    </div>

    <div class="card">
      <h3 style="font-size:0.9rem; font-weight:700; margin-bottom:10px;">Per-Platform Audience Overrides (Auto-Computes Main Avg & Total)</h3>
      <div style="display:flex; flex-direction:column; gap:10px;">
        ${STATE.users.map(u => `
          <div style="background:var(--bg-input); padding:12px; border-radius:var(--radius-md); border:1px solid var(--border-subtle); display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;">
            <div>
              <strong style="font-size:0.84rem;">@${escapeHtml(u.username)}</strong>
              <span class="badge tier">${escapeHtml(u.tierLabel)}</span>
              <div style="font-family:var(--font-mono); font-size:0.7rem; color:var(--text-secondary); margin-top:2px;">
                Main Avg: ${Number(u.followers).toLocaleString()} • Combined Total: ${Number(u.totalFollowers || 0).toLocaleString()}
              </div>
            </div>
            <div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap;">
              <label style="font-size:0.7rem; color:var(--text-secondary);">Metro: <input type="number" id="adminFolM_${escapeHtml(u.username)}" value="${u.metroFollowers || 0}" style="width:85px; padding:4px 6px;" /></label>
              <label style="font-size:0.7rem; color:var(--text-secondary);">PUNT: <input type="number" id="adminFolP_${escapeHtml(u.username)}" value="${u.puntFollowers || 0}" style="width:85px; padding:4px 6px;" /></label>
              <label style="font-size:0.7rem; color:var(--text-secondary);">Knok: <input type="number" id="adminFolK_${escapeHtml(u.username)}" value="${u.knoknoxFollowers || 0}" style="width:85px; padding:4px 6px;" /></label>
              <button class="btn btn-primary btn-sm admin-set-fol" data-user="${escapeHtml(u.username)}">Save</button>
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function bindAdminEvents() {
  ['HUB', 'METRO', 'PUNT', 'KNOK'].forEach(suffix => {
    const fInput = document.getElementById('logoFile_' + suffix);
    if (fInput) {
      fInput.addEventListener('change', () => {
        document.getElementById('lbl_logoFile_' + suffix).textContent = fInput.files[0] ? fInput.files[0].name : 'Upload Image File';
      });
    }
  });

  const saveLogosBtn = document.getElementById('saveLogosBtn');
  if (saveLogosBtn) {
    saveLogosBtn.addEventListener('click', async () => {
      const payload = { action: 'saveBrandLogos', adminUser: 'EnclaveAdmin', adminPass: 'ADMIN_KEY_2026' };
      const pairs = [
        { key: 'ENCLAVE_HUB_LOGO', fileId: 'logoFile_HUB', urlId: 'logoUrl_HUB' },
        { key: 'METRO_TV_LOGO', fileId: 'logoFile_METRO', urlId: 'logoUrl_METRO' },
        { key: 'PUNT_LOGO', fileId: 'logoFile_PUNT', urlId: 'logoUrl_PUNT' },
        { key: 'KNOKNOX_LOGO', fileId: 'logoFile_KNOK', urlId: 'logoUrl_KNOK' }
      ];
      showLoading('Processing Brand Assets');
      try {
        for (const item of pairs) {
          const fInput = document.getElementById(item.fileId);
          const uInput = document.getElementById(item.urlId);
          if (fInput && fInput.files && fInput.files[0]) {
            const resized = await autoResizeImageFile(fInput.files[0], 220, 220, 0.82);
            payload[item.key] = resized.dataUrl;
          } else if (uInput && uInput.value.trim()) {
            payload[item.key] = uInput.value.trim();
          }
        }
      } finally {
        hideLoading();
      }
      const res = await apiCall(payload, 'Publishing Brand Assets');
      if (!res.ok) return showToast(res.error || 'Failed to save logos');
      ingestBootstrap(res);
      showToast('Brand logos updated.');
    });
  }

  document.querySelectorAll('.admin-exec-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const subAction = btn.getAttribute('data-sub');
      const params = { subAction };
      if (btn.hasAttribute('data-post')) params.postId = btn.getAttribute('data-post');
      if (btn.hasAttribute('data-rep')) params.reportId = btn.getAttribute('data-rep');
      const res = await apiCall({ action: 'adminAction', adminUser: 'EnclaveAdmin', adminPass: 'ADMIN_KEY_2026', ...params }, 'Executing Action');
      if (!res.ok) return showToast(res.error);
      ingestBootstrap(res);
    });
  });

  document.querySelectorAll('.admin-unblock-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const res = await apiCall({ action: 'adminAction', adminUser: 'EnclaveAdmin', adminPass: 'ADMIN_KEY_2026', subAction: 'UNBLOCK_USER', blockId: btn.getAttribute('data-id') }, 'Unblocking');
      if (!res.ok) return showToast(res.error);
      ingestBootstrap(res);
    });
  });

  document.querySelectorAll('.admin-set-fol').forEach(btn => {
    btn.addEventListener('click', async () => {
      const targetUser = btn.getAttribute('data-user');
      const mVal = Number(document.getElementById('adminFolM_' + targetUser).value || 0);
      const pVal = Number(document.getElementById('adminFolP_' + targetUser).value || 0);
      const kVal = Number(document.getElementById('adminFolK_' + targetUser).value || 0);
      const res = await apiCall({
        action: 'adminAction',
        adminUser: 'EnclaveAdmin',
        adminPass: 'ADMIN_KEY_2026',
        subAction: 'SET_FOLLOWERS',
        targetUser,
        metroFollowers: mVal,
        puntFollowers: pVal,
        knoknoxFollowers: kVal
      }, 'Updating Followers');
      if (!res.ok) return showToast(res.error);
      ingestBootstrap(res);
      showToast('Audience counts updated.');
    });
  });
}

function escapeHtml(str) {
  return String(str === undefined || str === null ? '' : str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function formatTime(iso) {
  if (!iso) return 'now';
  const d = new Date(iso);
  return isNaN(d.getTime()) ? String(iso) : d.toLocaleString();
}
function showToast(msg) {
  const el = document.getElementById('toastBox');
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => { el.style.display = 'none'; }, 3400);
}
</script>
</body>
</html>
