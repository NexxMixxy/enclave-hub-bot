<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Enclave" />
  <meta name="theme-color" content="#090a0d" />
  <title>ENCLAVE NETWORK</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link id="dynamic-favicon" rel="icon" type="image/png" href="https://api.dicebear.com/7.x/shapes/svg?seed=EnclaveHub" />
  <link id="dynamic-touch-icon" rel="apple-touch-icon" href="https://api.dicebear.com/7.x/shapes/svg?seed=EnclaveHub" />

  <style>
    :root {
      --bg-base: #090a0d;
      --bg-surface: #111318;
      --bg-elevated: #171a21;
      --bg-input: #0c0e12;
      --border-subtle: rgba(255, 255, 255, 0.07);
      --border-hover: rgba(255, 255, 255, 0.16);
      --text-primary: #f3f4f6;
      --text-secondary: #9ca3af;
      --text-dim: #6b7280;
      --accent-enclave: #f59e0b;
      --accent-metro: #ef4444;
      --accent-punt: #53fc18;
      --accent-knok: #06b6d4;
      --danger: #f43f5e;
      --success: #10b981;
      --radius-lg: 12px;
      --radius-md: 8px;
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      min-width: 0;
      word-wrap: break-word;
      overflow-wrap: break-word;
      font-family: var(--font-sans);
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #050507;
      color: var(--text-primary);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.14); border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.28); }

    .viewport-wrapper {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app-shell {
      width: 100%;
      height: 100%;
      background: var(--bg-base);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .viewport-wrapper.mode-mobile {
      padding: 14px;
      background: #020203;
    }
    .viewport-wrapper.mode-mobile .app-shell {
      width: 100%;
      max-width: 420px;
      height: 94vh;
      max-height: 890px;
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.95);
    }

    /* Top Header */
    .top-bar {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 20px;
      background: rgba(17, 19, 24, 0.88);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-subtle);
      flex-shrink: 0;
      z-index: 20;
    }

    .brand-cluster {
      display: flex;
      align-items: center;
      gap: 11px;
      overflow: hidden;
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid var(--border-subtle);
      flex-shrink: 0;
      background: var(--bg-elevated);
    }

    .brand-title {
      font-weight: 800;
      font-size: 0.88rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #fff;
      white-space: nowrap;
    }

    .brand-sub {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      color: var(--text-dim);
      white-space: nowrap;
    }

    .top-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .icon-svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      flex-shrink: 0;
    }

    /* Workspace & Navigation */
    .workspace {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    .nav-rail {
      width: 224px;
      background: var(--bg-surface);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      padding: 14px 10px;
      gap: 4px;
      flex-shrink: 0;
      overflow-y: auto;
    }

    .nav-section-label {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      padding: 10px 12px 4px;
    }

    .viewport-wrapper.mode-mobile .workspace {
      flex-direction: column;
    }
    .viewport-wrapper.mode-mobile .nav-section-label {
      display: none;
    }
    .viewport-wrapper.mode-mobile .nav-rail {
      width: 100%;
      height: 58px;
      order: 2;
      flex-direction: row;
      justify-content: space-around;
      align-items: center;
      padding: 0 6px;
      border-right: none;
      border-top: 1px solid var(--border-subtle);
      overflow-x: auto;
      overflow-y: hidden;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 11px;
      width: 100%;
      padding: 9px 12px;
      border-radius: var(--radius-md);
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-secondary);
      font-size: 0.83rem;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;
    }
    .nav-btn img {
      width: 20px;
      height: 20px;
      border-radius: 5px;
      object-fit: cover;
      flex-shrink: 0;
      background: var(--bg-elevated);
    }
    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-primary);
    }
    .nav-btn.active {
      background: var(--bg-elevated);
      color: #fff;
      border-color: var(--border-subtle);
    }
    .nav-btn.metro-tab.active {
      color: #fff;
      background: rgba(239, 68, 68, 0.1);
      border-color: rgba(239, 68, 68, 0.3);
    }
    .nav-btn.punt-tab.active {
      color: var(--accent-punt);
      background: rgba(83, 252, 24, 0.08);
      border-color: rgba(83, 252, 24, 0.3);
    }
    .nav-btn.knok-tab.active {
      color: var(--accent-knok);
      background: rgba(6, 182, 212, 0.1);
      border-color: rgba(6, 182, 212, 0.3);
    }
    .nav-btn.admin-tab {
      color: var(--accent-enclave);
      margin-top: auto;
    }
    .nav-btn.admin-tab.active {
      background: rgba(245, 158, 11, 0.12);
      border-color: rgba(245, 158, 11, 0.35);
    }

    .viewport-wrapper.mode-mobile .nav-btn {
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 6px 8px;
      gap: 3px;
      font-size: 0.64rem;
      width: auto;
      min-width: 54px;
      margin-top: 0;
    }

    /* Main Stage */
    .main-stage {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .stage-inner {
      width: 100%;
      max-width: 780px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .viewport-wrapper.mode-mobile .main-stage {
      padding: 12px;
    }

    /* Surfaces & Cards */
    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 18px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 12px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 10px;
    }

    /* Badges & Pills */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 7px;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 600;
      background: var(--bg-elevated);
      color: var(--text-secondary);
      border: 1px solid var(--border-subtle);
      white-space: nowrap;
    }
    .badge.verified {
      background: rgba(6, 182, 212, 0.12);
      color: var(--accent-knok);
      border-color: rgba(6, 182, 212, 0.3);
    }
    .badge.tier {
      background: rgba(245, 158, 11, 0.1);
      color: var(--accent-enclave);
      border-color: rgba(245, 158, 11, 0.25);
    }
    .badge.metro { background: rgba(239, 68, 68, 0.12); color: #f87171; border-color: rgba(239, 68, 68, 0.3); }
    .badge.punt { background: rgba(83, 252, 24, 0.1); color: var(--accent-punt); border-color: rgba(83, 252, 24, 0.3); }
    .badge.knoknox { background: rgba(6, 182, 212, 0.12); color: #38bdf8; border-color: rgba(6, 182, 212, 0.3); }

    /* Form Controls */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }
    .form-group label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-secondary);
    }
    input[type="text"],
    input[type="password"],
    input[type="number"],
    input[type="url"],
    select,
    textarea {
      width: 100%;
      font-family: var(--font-sans);
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      padding: 10px 12px;
      border-radius: var(--radius-md);
      font-size: 0.86rem;
      outline: none;
      transition: border-color 0.15s;
    }
    textarea {
      resize: vertical;
      min-height: 82px;
      line-height: 1.5;
    }
    input:focus, select:focus, textarea:focus {
      border-color: rgba(255, 255, 255, 0.28);
    }

    /* Custom File Upload Dropzone */
    .upload-dropzone {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 14px;
      background: var(--bg-input);
      border: 1px dashed rgba(255, 255, 255, 0.18);
      border-radius: var(--radius-md);
      color: var(--text-secondary);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
    }
    .upload-dropzone:hover {
      border-color: var(--text-primary);
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.03);
    }
    .upload-dropzone input[type="file"] {
      display: none;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 8px 14px;
      border-radius: var(--radius-md);
      border: 1px solid transparent;
      font-family: var(--font-sans);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .btn:disabled { opacity: 0.5; pointer-events: none; }
    .btn-primary { background: #f3f4f6; color: #090a0d; font-weight: 700; }
    .btn-primary:hover { background: #ffffff; }
    .btn-metro { background: var(--accent-metro); color: #fff; font-weight: 700; }
    .btn-punt { background: var(--accent-punt); color: #041200; font-weight: 700; }
    .btn-knok { background: var(--accent-knok); color: #041318; font-weight: 700; }
    .btn-outline { background: var(--bg-elevated); color: var(--text-primary); border-color: var(--border-subtle); }
    .btn-outline:hover { border-color: var(--border-hover); background: rgba(255,255,255,0.06); }
    .btn-danger { background: rgba(244, 63, 94, 0.12); color: #fb7185; border-color: rgba(244, 63, 94, 0.28); }
    .btn-danger:hover { background: rgba(244, 63, 94, 0.2); }
    .btn-success { background: rgba(16, 185, 129, 0.14); color: #34d399; border-color: rgba(16, 185, 129, 0.3); }
    .btn-sm { padding: 5px 10px; font-size: 0.74rem; border-radius: 6px; }

    /* Auth Container */
    .auth-container {
      max-width: 420px;
      width: 100%;
      margin: 40px auto;
    }

    /* Feed Post Cards */
    .post-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: border-color 0.15s;
    }
    .post-card:hover {
      border-color: rgba(255, 255, 255, 0.12);
    }
    .post-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .post-author {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }
    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--border-hover);
      flex-shrink: 0;
      background: var(--bg-elevated);
    }
    .avatar-lg {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--border-hover);
      flex-shrink: 0;
      background: var(--bg-elevated);
    }
    .post-caption {
      font-size: 0.9rem;
      line-height: 1.55;
      color: var(--text-primary);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .post-media-box {
      width: 100%;
      border-radius: 10px;
      overflow: hidden;
      background: #050608;
      border: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      max-height: 440px;
    }
    .post-media-box img,
    .post-media-box video {
      max-width: 100%;
      max-height: 430px;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      margin: 0 auto;
    }
    .post-media-box audio {
      width: 100%;
      margin: 12px;
    }

    .post-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      padding-top: 10px;
      border-top: 1px solid var(--border-subtle);
    }

    .shared-embed {
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-left: 3px solid var(--text-secondary);
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
    }

    /* Chat Layout */
    .chat-layout {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 12px;
      min-height: 500px;
    }
    .viewport-wrapper.mode-mobile .chat-layout {
      grid-template-columns: 1fr;
    }
    .chat-messages {
      height: 360px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px;
      background: var(--bg-input);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
    }
    .msg-bubble {
      max-width: 80%;
      padding: 8px 12px;
      border-radius: 10px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      align-self: flex-start;
      font-size: 0.84rem;
    }
    .msg-bubble.mine {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(255, 255, 255, 0.18);
      align-self: flex-end;
    }
    .reply-quote {
      font-size: 0.72rem;
      padding: 4px 8px;
      margin-bottom: 5px;
      border-left: 2px solid var(--accent-enclave);
      background: rgba(0, 0, 0, 0.3);
      border-radius: 4px;
      color: var(--text-secondary);
    }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 999;
    }
    .modal-backdrop.open { display: flex; }
    .modal-box {
      background: var(--bg-surface);
      border: 1px solid var(--border-hover);
      border-radius: var(--radius-lg);
      max-width: 580px;
      width: 100%;
      max-height: 86vh;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Anti-Double-Tap Loading Popup */
    .loading-popup-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 6, 8, 0.8);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      pointer-events: all;
      user-select: none;
    }
    .loading-popup-overlay.active { display: flex; }
    .loading-popup-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-hover);
      border-radius: 14px;
      padding: 22px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.9);
      text-align: center;
      min-width: 210px;
    }
    .loading-spinner-circle {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.12);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: enclaveSpin 0.7s linear infinite;
    }
    @keyframes enclaveSpin { to { transform: rotate(360deg); } }
    .loading-title-text {
      font-size: 0.92rem;
      font-weight: 700;
      color: #fff;
    }
    .loading-dots::after {
      content: '';
      animation: dotPulse 1.4s steps(4, end) infinite;
    }
    @keyframes dotPulse {
      0% { content: ''; }
      25% { content: '.'; }
      50% { content: '..'; }
      75% { content: '...'; }
      100% { content: ''; }
    }
    .loading-sub-text {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-secondary);
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--bg-elevated);
      color: #fff;
      border: 1px solid var(--border-hover);
      padding: 10px 16px;
      border-radius: var(--radius-md);
      font-size: 0.8rem;
      font-weight: 600;
      z-index: 1200;
      display: none;
      box-shadow: 0 12px 30px rgba(0,0,0,0.7);
    }
  </style>
</head>
<body>

<!-- LOADING POPUP -->
<div id="loadingOverlay" class="loading-popup-overlay">
  <div class="loading-popup-card">
    <div class="loading-spinner-circle"></div>
    <div class="loading-title-text">Loading<span class="loading-dots"></span></div>
    <div class="loading-sub-text" id="loadingSubText">Syncing Enclave Network</div>
  </div>
</div>

<div id="viewportWrapper" class="viewport-wrapper mode-desktop">
  <div class="app-shell">

    <header class="top-bar">
      <div class="brand-cluster">
        <img id="cornerHubLogo" class="brand-logo" src="" alt="Enclave" onerror="this.src=FALLBACK_AVATAR" />
        <div>
          <div class="brand-title" id="topBarTitle">ENCLAVE NETWORK</div>
          <div class="brand-sub" id="topBarSubtitle">METRO.TV / PUNT / KNOKNOX</div>
        </div>
      </div>

      <div class="top-controls">
        <button type="button" class="btn btn-outline btn-sm" onclick="toggleViewportMode()" id="viewportToggleBtn"></button>
        <button type="button" class="btn btn-outline btn-sm" id="syncBtn" onclick="refreshFromServer(true)" style="display:none;">
          <svg class="icon-svg" viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
          <span>Sync</span>
        </button>
        <button type="button" class="btn btn-danger btn-sm" id="logoutBtn" onclick="logout()" style="display:none;">
          <span>Sign Out</span>
        </button>
      </div>
    </header>

    <div class="workspace">
      <nav class="nav-rail" id="navRail" style="display:none;">
        <div class="nav-section-label">Account</div>
        <button class="nav-btn active" data-page="profile" onclick="navigate('profile')">
          <svg class="icon-svg" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>Profile</span>
        </button>
        <button class="nav-btn" data-page="search" onclick="navigate('search')">
          <svg class="icon-svg" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <span>Directory</span>
        </button>
        <button class="nav-btn" data-page="connections" onclick="navigate('connections')">
          <svg class="icon-svg" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span>Connections</span>
        </button>

        <div class="nav-section-label">Networks</div>
        <button class="nav-btn metro-tab" data-page="metrotv" onclick="navigate('metrotv')">

function autoResizeImageFile(file, maxWidth, maxHeight, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width;
        let h = img.height;
        const ratio = Math.min(maxWidth / w, maxHeight / h, 1);
        w = Math.max(1, Math.round(w * ratio));
        h = Math.max(1, Math.round(h * ratio));

        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#090a0d';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);

        let q = quality || 0.74;
        let dataUrl = canvas.toDataURL('image/jpeg', q);
        while (dataUrl.length > 36000 && q > 0.35) {
          q -= 0.1;
          dataUrl = canvas.toDataURL('image/jpeg', q);
        }
        resolve({
          dataUrl,
          width: w,
          height: h,
          resolution: w + '×' + h
        });
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function fixMediaUrl(url) {
  if (!url) return '';
  const str = String(url).trim();
  const match = str.match(/drive\.google\.com\/uc\?export=view&id=([a-zA-Z0-9_-]+)/);
  if (match && match[1]) {
    return 'https://drive.google.com/thumbnail?id=' + match[1] + '&sz=w800';
  }
  return str;
}

async function apiCall(payload, loadingMessage) {
  if (STATE.isBusy && payload.action !== 'getBootstrap') {
    return { ok: false, error: 'Action in progress...' };
  }
  if (loadingMessage) showLoading(loadingMessage);

  const scriptUrl = (LOGO_CONFIG.GOOGLE_SCRIPT_URL || '').trim();
  try {
    const response = await fetch(scriptUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    return await response.json();
  } catch (err) {
    showToast('Connection error: ' + err.message);
    return { ok: false, error: err.message };
  } finally {
    if (loadingMessage) hideLoading();
  }
}

function ingestBootstrap(res, skipCacheSave) {
  if (!res || !res.currentUser) return;
  STATE.currentUser = res.currentUser;
  STATE.users = res.users || [];
  STATE.posts = res.posts || [];
  STATE.connections = res.connections || [];
  STATE.blocks = res.blocks || [];
  STATE.groups = res.groups || [];
  STATE.messages = res.messages || [];
  STATE.reports = res.reports || [];
  STATE.history = res.history || [];

  if (res.brandLogos) {
    ['ENCLAVE_HUB_LOGO', 'METRO_TV_LOGO', 'PUNT_LOGO', 'KNOKNOX_LOGO'].forEach(k => {
      if (res.brandLogos[k]) LOGO_CONFIG[k] = res.brandLogos[k];
    });
    localStorage.setItem('enclave_cached_logos', JSON.stringify(LOGO_CONFIG));
  } else if (res.globalAdminLogo) {
    LOGO_CONFIG.ENCLAVE_HUB_LOGO = res.globalAdminLogo;
  }
  applyLogos();

  localStorage.setItem('enclave_session_user', STATE.currentUser.username);
  if (!skipCacheSave) {
    try {
      localStorage.setItem('enclave_state_cache_' + STATE.currentUser.username.toLowerCase(), JSON.stringify(res));
    } catch (e) {}
  }

  document.getElementById('navRail').style.display = 'flex';
  document.getElementById('syncBtn').style.display = 'inline-flex';
  document.getElementById('logoutBtn').style.display = 'inline-flex';
  document.getElementById('navAdminBtn').style.display = STATE.currentUser.isAdmin ? 'flex' : 'none';

  render();
  if (STATE.openOPModalUser) openOPProfileModal(STATE.openOPModalUser);
}

async function refreshFromServer(withLoadingPopup) {
  const user = STATE.currentUser ? STATE.currentUser.username : localStorage.getItem('enclave_session_user');
  if (!user) return;
  const res = await apiCall({ action: 'getBootstrap', username: user }, withLoadingPopup ? 'Syncing Feed' : null);
  if (res && res.ok && res.currentUser) {
    ingestBootstrap(res);
    if (withLoadingPopup) showToast('Feed synchronized.');
  }
}

function logout() {

async function handleMediaFileSelect(inputEl, platformKey) {
  const file = inputEl.files && inputEl.files[0];
  const statusEl = document.getElementById('mediaCheckStatus');
  const previewEl = document.getElementById('mediaLivePreviewBox');
  if (!file) return;

  const spec = PLATFORM_SPECS[platformKey];

  if (file.type.startsWith('image/')) {
    showLoading('Optimizing Image...');
    try {
      const resized = await autoResizeImageFile(file, spec.targetMaxW, spec.targetMaxH, 0.76);
      STATE.pendingMedia = {
        dataUrl: resized.dataUrl,
        mediaType: 'image',
        durationSec: 0,
        resolution: resized.resolution
      };
      if (statusEl) statusEl.innerHTML = `<span style="color:var(--success);">Attached (${resized.resolution})</span>`;
      if (previewEl) {
        previewEl.style.display = 'flex';
        previewEl.innerHTML = `<img src="${resized.dataUrl}" alt="Preview" />`;
      }
    } catch (err) {
      showToast('Failed to process image.');
    } finally {
      hideLoading();
    }
  } else if (file.type.startsWith('video/') || file.type.startsWith('audio/')) {
    const isVideo = file.type.startsWith('video/');
    const tempUrl = URL.createObjectURL(file);
    const mediaEl = document.createElement(isVideo ? 'video' : 'audio');
    mediaEl.preload = 'metadata';

    showLoading('Verifying Media...');
    mediaEl.onloadedmetadata = () => {
      const dur = Math.round(mediaEl.duration || 0);
      const res = isVideo ? (mediaEl.videoWidth + '×' + mediaEl.videoHeight) : 'Audio';
      URL.revokeObjectURL(tempUrl);

      if (dur > spec.maxDurationSec) {
        hideLoading();
        STATE.pendingMedia = { dataUrl: '', mediaType: 'none', durationSec: 0, resolution: '' };
        inputEl.value = '';
        if (statusEl) statusEl.innerHTML = `<span style="color:var(--danger);">Exceeds ${spec.maxDurationSec/60}m limit (${dur}s)</span>`;
        showToast(`${spec.name} max duration is ${spec.maxDurationSec / 60}m.`);
        return;
      }

      const reader = new FileReader();
      reader.onload = ev => {
        hideLoading();
        STATE.pendingMedia = {
          dataUrl: ev.target.result,
          mediaType: isVideo ? 'video' : 'audio',
          durationSec: dur,
          resolution: res
        };
        if (statusEl) statusEl.innerHTML = `<span style="color:var(--success);">Ready (${dur}s • ${res})</span>`;
      };
      reader.readAsDataURL(file);
    };
    mediaEl.onerror = () => {
      hideLoading();
      showToast('Unsupported media format.');
    };
    mediaEl.src = tempUrl;
  }
}

    case 'admin': stage.innerHTML = STATE.currentUser.isAdmin ? renderAdminView() : renderProfileView(); break;

}

            </label>

async function submitLogin(e) {
  e.preventDefault();
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value.trim();
  const res = await apiCall({ action: 'login', username, password }, 'Authenticating');
  if (!res.ok) return showToast(res.error || 'Authentication failed');
  ingestBootstrap(res);
}

async function submitSignup(e) {
  e.preventDefault();
  const username = document.getElementById('signupUsername').value.trim();
  const displayName = document.getElementById('signupDisplayName').value.trim();
  const password = document.getElementById('signupPassword').value.trim();
  const initialFollowers = Number(document.getElementById('signupFollowers').value || 10);
  const urlInput = document.getElementById('signupPicUrl').value.trim();
  const fileInput = document.getElementById('signupPicFile');

  let profilePic = urlInput;
  if (fileInput.files && fileInput.files[0]) {
    showLoading('Processing Avatar');
    const resized = await autoResizeImageFile(fileInput.files[0], 240, 240, 0.78);
    profilePic = resized.dataUrl;
    hideLoading();
  }

  const res = await apiCall({
    action: 'signup',
    username,
    displayName,
    password,
    initialFollowers,
    profilePic
  }, 'Provisioning Account');
  if (!res.ok) return showToast(res.error || 'Registration failed');
  ingestBootstrap(res);
}

async function saveProfileChanges() {
  const displayName = document.getElementById('editDisplayName').value.trim();
  const avatarInput = document.getElementById('editAvatarFile');

  let profilePic = '';
  if (avatarInput && avatarInput.files && avatarInput.files[0]) {
    showLoading('Optimizing Avatar');
    const resized = await autoResizeImageFile(avatarInput.files[0], 240, 240, 0.78);
    profilePic = resized.dataUrl;
    hideLoading();
  }

  const res = await apiCall({
    action: 'updateProfile',
    username: STATE.currentUser.username,
    displayName,
    profilePic
  }, 'Saving Profile');
  if (!res.ok) return showToast(res.error);
  ingestBootstrap(res);
  showToast('Profile saved.');
}

async function submitPlatformPost(e, platformKey) {
  e.preventDefault();
  const caption = document.getElementById('postCaptionInput').value.trim();
  const directUrl = document.getElementById('postDirectMediaUrl').value.trim();
  const directType = document.getElementById('postDirectMediaType').value;

  let mediaUrl = STATE.pendingMedia.dataUrl;
  let mediaType = STATE.pendingMedia.mediaType;
  let durationSec = STATE.pendingMedia.durationSec;
  let resolution = STATE.pendingMedia.resolution || '';

  if (!mediaUrl && directUrl) {
    mediaUrl = directUrl;
    mediaType = directType;
  }

  const res = await apiCall({
    action: 'createPost',
    author: STATE.currentUser.username,
    platform: platformKey,
    caption,
    mediaUrl,
    mediaType,
    durationSec,
    resolution
  }, 'Publishing Post');

  if (!res.ok) return showToast(res.error);
  STATE.composerOpen = false;
  STATE.pendingMedia = { dataUrl: '', mediaType: 'none', durationSec: 0, resolution: '' };
  ingestBootstrap(res);
  showToast(`Posted to ${PLATFORM_SPECS[platformKey].name}`);
}

async function voteOnPost(postId, voteType) {
  if (STATE.isBusy) return;
  const targetPost = STATE.posts.find(p => String(p.postId) === String(postId));
  if (!targetPost) return;

  const res = await apiCall({
    action: 'votePost',
    postId: postId,
    username: STATE.currentUser.username,
    voteType: voteType
  }, 'Updating Vote');

  if (!res || !res.ok) return showToast((res && res.error) ? res.error : 'Vote failed');

  if (res.fastVote) {
    const prevUp = targetPost.upvotes;
    const prevDown = targetPost.downvotes;
    targetPost.upvotes = res.upvotes;
    targetPost.downvotes = res.downvotes;
    targetPost.myVote = res.myVote;

    const deltaUp = res.upvotes - prevUp;
    const deltaDown = res.downvotes - prevDown;
    const authorObj = STATE.users.find(u => u.username.toLowerCase() === targetPost.author.toLowerCase());
    if (authorObj) {
      authorObj.totalUpvotes = Math.max(0, (authorObj.totalUpvotes || 0) + deltaUp);
      authorObj.totalDownvotes = Math.max(0, (authorObj.totalDownvotes || 0) + deltaDown);
    }
    if (STATE.currentUser.username.toLowerCase() === targetPost.author.toLowerCase() && authorObj) {
      STATE.currentUser.totalUpvotes = authorObj.totalUpvotes;
      STATE.currentUser.totalDownvotes = authorObj.totalDownvotes;
    }
    render();
    if (STATE.openOPModalUser) openOPProfileModal(STATE.openOPModalUser);
  } else if (res.currentUser) {
    ingestBootstrap(res);
  }
}

  const res = await apiCall({

    resolution: orig.resolution,
    sharedFromId: orig.postId,

  showToast('Reposted to your channel.');
}

  const otherUsers = STATE.users.filter(u => {

    return u.username.toLowerCase().includes(q) || u.displayName.toLowerCase().includes(q);
  });

  return `
    <div class="card">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;">
        <h2 style="font-size:1rem; font-weight:700;">Creator Directory</h2>

      </div>
      <input type="text" placeholder="Filter by handle or channel name..." value="${escapeHtml(STATE.searchQuery)}" oninput="STATE.searchQuery=this.value; render();" />
    </div>

    <div class="grid-2">
      ${otherUsers.map(u => {

function getConnectionStatus(me, other) {
  const m = me.toLowerCase();
  const o = other.toLowerCase();
  const isBlocked = STATE.blocks.some(b =>
    (b.blocker.toLowerCase() === m && b.blocked.toLowerCase() === o) ||
    (b.blocker.toLowerCase() === o && b.blocked.toLowerCase() === m)
  );
  if (isBlocked) return 'BLOCKED';
  const conn = STATE.connections.find(c =>
    (c.requester.toLowerCase() === m && c.receiver.toLowerCase() === o) ||
    (c.requester.toLowerCase() === o && c.receiver.toLowerCase() === m)
  );
  if (!conn) return 'NONE';
  if (conn.status === 'ACCEPTED') return 'CONNECTED';
  if (conn.status === 'PENDING') return 'PENDING';
  return 'NONE';
}

async function sendConnection(receiver) {
  const res = await apiCall({ action: 'sendConnectionRequest', requester: STATE.currentUser.username, receiver }, 'Sending Request');

}

}

  STATE.activeChat.replyToMsgId = msgId;

async function submitChatMessage(e) {
  e.preventDefault();
  const text = document.getElementById('chatTextInput').value.trim();
  const imgInput = document.getElementById('chatImageInput');
  let mediaUrl = '';
  if (imgInput && imgInput.files && imgInput.files[0]) {
    showLoading('Optimizing Image');
    const resized = await autoResizeImageFile(imgInput.files[0], 420, 420, 0.72);
    mediaUrl = resized.dataUrl;
    hideLoading();
  }
  if (!text && !mediaUrl) return;

  const res = await apiCall({
    action: 'sendMessage',
    sender: STATE.currentUser.username,
    chatType: STATE.activeChat.type,
    targetId: STATE.activeChat.targetId,
    text,
    mediaUrl,
    replyToMsgId: STATE.activeChat.replyToMsgId,
    replyPreview: STATE.activeChat.replyPreview
  }, 'Sending');
  if (!res.ok) return showToast(res.error);
  STATE.activeChat.replyToMsgId = '';
  STATE.activeChat.replyPreview = '';
  ingestBootstrap(res);
}

    { key: 'PUNT_LOGO', fileId: 'logoFile_PUNT', urlId: 'logoUrl_PUNT' },
    { key: 'KNOKNOX_LOGO', fileId: 'logoFile_KNOK', urlId: 'logoUrl_KNOK' }
  ];

  showLoading('Processing Brand Assets');
  try {
    for (const item of pairs) {
      const fInput = document.getElementById(item.fileId);
      const uInput = document.getElementById(item.urlId);
      if (fInput && fInput.files && fInput.files[0]) {
        const resized = await autoResizeImageFile(fInput.files[0], 220, 220, 0.82);
        payload[item.key] = resized.dataUrl;
      } else if (uInput && uInput.value.trim()) {
        payload[item.key] = uInput.value.trim();
      }
    }
  } finally {
    hideLoading();
  }

  const res = await apiCall(payload, 'Publishing Brand Assets');
  if (!res.ok) return showToast(res.error || 'Failed to save logos');
  ingestBootstrap(res);
  showToast('Brand logos updated.');
}

async function adminExec(subAction, extraParams) {
  const res = await apiCall({
    action: 'adminAction',
    adminUser: 'EnclaveAdmin',
    adminPass: 'ADMIN_KEY_2026',
    subAction,
    ...extraParams
  }, 'Applying Moderation Action');
  if (!res.ok) return showToast(res.error);
  ingestBootstrap(res);
}

function adminSetFollowers(targetUser) {
  const val = Number(document.getElementById('adminFol_' + targetUser).value || 0);
  adminExec('SET_FOLLOWERS', { targetUser, followers: val });
}

function escapeHtml(str) {
  return String(str === undefined || str === null ? '' : str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function formatTime(iso) {
  if (!iso) return 'now';
  const d = new Date(iso);
  return isNaN(d.getTime()) ? String(iso) : d.toLocaleString();
}

function showToast(msg) {
  const el = document.getElementById('toastBox');
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => { el.style.display = 'none'; }, 3200);
}
</script>
